[project]
name = "avtext"
version = "0.0.1"
description = "Aviation-text LLM lab: METAR/TAF decoding dataset, eval harness, and a LoRA fine-tuning study on Gemma 4 E4B."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

# ── Runtime dependencies ─────────────────────────────────────────────────────
# Kept deliberately lean. Note what is NOT here:
#   - No torch / transformers / unsloth: fine-tuning happens off this env. See ADR-003.
#   - No inference libs (mlx / llama-cpp-python): the harness reaches a model through an
#     OpenAI-compatible HTTP server via httpx, so Mac-only serving stacks stay out of the
#     package and CI (ubuntu) stays green. The local Gemma is served by mlx_vlm.server
#     (installed as a `uv tool`, not a dep). See src/avtext/harness/models.py.
dependencies = [
    "pydantic>=2.7",        # the canonical decoded-METAR/TAF schema (Phase 2)
    "duckdb>=1.0",          # local analytical store for the Parquet corpus
    "pyarrow>=16",          # Parquet read/write
    "httpx>=0.27",          # HTTP client for IEM/AWC ingest
    "pyyaml>=6",            # configs/*.yaml
    "huggingface-hub>=0.24",# push raw snapshots to a HF dataset repo (collector)
    # Oracle parsers — 3 independent lineages; used by the scope probe now and
    # wrapped as canonical-schema adapters in Phase 2 (see src/avtext/oracles/).
    "metar>=2.0.1",                   # python-metar; raises ParserError on bad input
    "avwx-engine>=1.9.8",             # avwx; tolerant — returns nulls, never raises
    "metar-taf-parser-mivek>=1.13.1", # mivek; separate lineage, strong TAF support
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avtext"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img"><rect x="0" y="0" width="760" height="448" rx="10" fill="#fcfcfb" stroke="#e7e5e0"/><text x="28" y="38" font-size="18" font-weight="700" fill="#1a1a19">Making it trainable on one mini-PC: seconds per step</text><text x="28" y="60" font-size="13" fill="#52514e">Same AMD Strix Halo iGPU, stacked optimizations. Lower is better.</text><line x1="64" y1="340.0" x2="732" y2="340.0" stroke="#eceae5"/><text x="54" y="344.0" font-size="12" fill="#52514e" text-anchor="end">0</text><line x1="64" y1="280.0" x2="732" y2="280.0" stroke="#eceae5"/><text x="54" y="284.0" font-size="12" fill="#52514e" text-anchor="end">10</text><line x1="64" y1="220.0" x2="732" y2="220.0" stroke="#eceae5"/><text x="54" y="224.0" font-size="12" fill="#52514e" text-anchor="end">20</text><line x1="64" y1="160.0" x2="732" y2="160.0" stroke="#eceae5"/><text x="54" y="164.0" font-size="12" fill="#52514e" text-anchor="end">30</text><line x1="64" y1="100.0" x2="732" y2="100.0" stroke="#eceae5"/><text x="54" y="104.0" font-size="12" fill="#52514e" text-anchor="end">40</text><path d="M100.7,340.0 L100.7,104.0 Q100.7,100.0 104.7,100.0 L190.3,100.0 Q194.3,100.0 194.3,104.0 L194.3,340.0 Z" fill="#b9d3f2"/><text x="147.5" y="93.0" font-size="13" font-weight="700" fill="#1a1a19" text-anchor="middle">40</text><text x="147.5" y="362.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">Random</text><text x="147.5" y="377.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">batches</text><path d="M267.7,340.0 L267.7,272.0 Q267.7,268.0 271.7,268.0 L357.3,268.0 Q361.3,268.0 361.3,272.0 L361.3,340.0 Z" fill="#b9d3f2"/><text x="314.5" y="261.0" font-size="13" font-weight="700" fill="#1a1a19" text-anchor="middle">12</text><text x="314.5" y="362.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">+ Length</text><text x="314.5" y="377.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">grouping</text><path d="M434.7,340.0 L434.7,273.2 Q434.7,269.2 438.7,269.2 L524.3,269.2 Q528.3,269.2 528.3,273.2 L528.3,340.0 Z" fill="#b9d3f2"/><text x="481.5" y="262.2" font-size="13" font-weight="700" fill="#1a1a19" text-anchor="middle">11.8</text><text x="481.5" y="362.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">+ torch</text><text x="481.5" y="377.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">.compile</text><path d="M601.7,340.0 L601.7,302.0 Q601.7,298.0 605.7,298.0 L691.3,298.0 Q695.3,298.0 695.3,302.0 L695.3,340.0 Z" fill="#2a78d6"/><text x="648.5" y="291.0" font-size="13" font-weight="700" fill="#1a1a19" text-anchor="middle">7</text><text x="648.5" y="362.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">+ Adaptive</text><text x="648.5" y="377.0" font-size="12.5" fill="#1a1a19" text-anchor="middle">checkpointing</text><text x="24" y="92" font-size="12" fill="#52514e">seconds / step</text><text x="64" y="428" font-size="12" fill="#52514e">End to end this took one epoch from ≈48 h down to ≈17 h — a 2.8× speedup, no new hardware.</text></svg>
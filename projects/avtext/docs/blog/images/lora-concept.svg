<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="LoRA decomposition: a frozen weight matrix plus a low-rank trainable update B times A">
  <rect x="0" y="0" width="760" height="330" rx="10" fill="#fcfcfb" stroke="#e7e5e0"/>
  <text x="28" y="40" font-size="18" font-weight="700" fill="#1a1a19">LoRA: freeze the model, train a small side matrix</text>
  <text x="28" y="62" font-size="13" fill="#52514e">The fine-tune is the low-rank update &#916;W = B&#183;A. The original weights W never move.</text>

  <!-- W frozen -->
  <rect x="40" y="104" width="150" height="150" rx="6" fill="#efedea" stroke="#c8c4bd"/>
  <text x="115" y="182" font-size="40" font-weight="700" fill="#7e7770" text-anchor="middle">W</text>
  <text x="115" y="210" font-size="13" fill="#52514e" text-anchor="middle">frozen</text>
  <text x="115" y="278" font-size="12.5" fill="#52514e" text-anchor="middle">d &#215; d  (pretrained)</text>
  <!-- lock -->
  <g transform="translate(150,116)">
    <rect x="0" y="6" width="16" height="12" rx="2" fill="#7e7770"/>
    <path d="M3,6 V3 a5,5 0 0 1 10,0 V6" fill="none" stroke="#7e7770" stroke-width="2"/>
  </g>

  <text x="212" y="188" font-size="30" fill="#52514e" text-anchor="middle">+</text>

  <!-- B tall -->
  <rect x="240" y="104" width="40" height="150" rx="5" fill="#2a78d6"/>
  <text x="260" y="184" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="260" y="278" font-size="12.5" fill="#2a78d6" text-anchor="middle">d &#215; r</text>

  <text x="298" y="188" font-size="24" fill="#52514e" text-anchor="middle">&#215;</text>

  <!-- A wide -->
  <rect x="318" y="159" width="150" height="40" rx="5" fill="#2a78d6"/>
  <text x="393" y="185" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="393" y="278" font-size="12.5" fill="#2a78d6" text-anchor="middle">r &#215; d</text>

  <!-- brace + trainable label -->
  <path d="M240,92 q0,-10 10,-10 h208 q10,0 10,10" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="354" y="74" font-size="13" font-weight="600" fill="#2a78d6" text-anchor="middle">trainable &#8212; rank r = 16</text>

  <!-- equals / result -->
  <text x="500" y="188" font-size="30" fill="#52514e" text-anchor="middle">=</text>
  <rect x="530" y="104" width="150" height="150" rx="6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="605" y="176" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">&#916;W</text>
  <text x="605" y="204" font-size="12.5" fill="#52514e" text-anchor="middle">same shape as W</text>
  <text x="605" y="278" font-size="12.5" fill="#52514e" text-anchor="middle">built from far fewer numbers</text>

  <text x="28" y="312" font-size="12.5" fill="#1a1a19">On Gemma 4 E4B: d = 2560, r = 16. B and A hold <tspan font-weight="700">34.9M</tspan> numbers &#8212; <tspan font-weight="700">0.44%</tspan> of the model &#8212; and only they train.</text>
</svg>

# Station set for the vertical slice (51 stations; all validated against IEM 2026-07-29).
#
# WEIGHTING IS EVIDENCE-DRIVEN (scope probe, Session 2): the messy tail the
# fine-tune targets came from specific sources, so we over-represent them:
#   - Regional/ICAO format extensions (parse failures)  -> Scandinavia + EU AUTO
#   - RMK T-group precision (parser disagreement)        -> US AUTO small fields
#   - MPS wind units (unit handling)                     -> CIS/Russia + China
# ...plus terrain / coastal / arctic variety for weather diversity.
#
# `icao` = IEM ASOS station id. Validate with:
#   uv run python -m avtext.ingest.iem --validate
# Candidates that return no IEM data get pruned before the full backfill.
#
# Fields: icao, name, region (eu|us|other), terrain, tags (why it earns a slot)

stations:
  # ── EU · Poland (home region) ──
  - {icao: EPGD, name: "Gdańsk",          region: eu, terrain: coastal,  tags: [home, sea-breeze, fog]}
  - {icao: EPWA, name: "Warsaw Chopin",   region: eu, terrain: plains,   tags: [busy, manned]}
  - {icao: EPKK, name: "Kraków",          region: eu, terrain: plains,   tags: []}
  - {icao: EPKT, name: "Katowice",        region: eu, terrain: plains,   tags: []}
  - {icao: EPPO, name: "Poznań",          region: eu, terrain: plains,   tags: []}

  # ── EU · Scandinavia (regional format extensions -> parse failures) ──
  - {icao: ENGM, name: "Oslo Gardermoen", region: eu, terrain: plains,   tags: [snow]}
  - {icao: ENBR, name: "Bergen",          region: eu, terrain: coastal,  tags: [rain, terrain]}
  - {icao: ENVA, name: "Trondheim Værnes",region: eu, terrain: coastal,  tags: [snow]}
  - {icao: ENAL, name: "Ålesund",         region: eu, terrain: coastal,  tags: [terrain, auto]}
  - {icao: ENSB, name: "Svalbard/Longyear",region: eu, terrain: coastal, tags: [arctic, auto, regional-ext]}

  # ── EU · rest ──
  - {icao: EGLL, name: "London Heathrow", region: eu, terrain: plains,   tags: [busy, complex-taf]}
  - {icao: EGPH, name: "Edinburgh",       region: eu, terrain: coastal,  tags: [wind]}
  - {icao: EGCC, name: "Manchester",      region: eu, terrain: plains,   tags: []}
  - {icao: EDDF, name: "Frankfurt",       region: eu, terrain: plains,   tags: [busy]}

  - {icao: LFML, name: "Marseille",       region: eu, terrain: coastal,  tags: [mistral]}
  - {icao: LOWI, name: "Innsbruck",       region: eu, terrain: valley,   tags: [terrain-winds, tricky-taf]}
  - {icao: LOWS, name: "Salzburg",        region: eu, terrain: valley,   tags: [terrain]}
  - {icao: BIKF, name: "Keflavík",        region: eu, terrain: coastal,  tags: [wind, harsh]}

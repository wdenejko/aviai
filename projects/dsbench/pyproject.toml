[project]
name = "dsbench"
version = "0.0.1"
description = "Execution-verified data engineering / data analysis / data science benchmark for the Qwen3.x-35B-A3B coding fine-tune study (before / during / after)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

# The harness reaches the model over HTTP (httpx), exactly like avtext, so no inference library
# is a dependency. Unlike avtext, this benchmark EXECUTES model code, so the data stack is a
# runtime dep: the sandbox worker imports these to run and grade candidate solutions.
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    # v2 agentic sandbox (ADR-003): the harness + ingest loaders talk to ClickHouse.
    "clickhouse-connect>=0.8",
]

[project.scripts]
dsbench-run = "dsbench.harness.runner:main"
dsbench-compare = "dsbench.harness.compare:main"
dsbench-selftest = "dsbench.harness.selftest:main"
# v2 agentic sandbox (ADR-003)
dsbench-agent-run = "dsbench.agentic.runner:main"
dsbench-agent-selftest = "dsbench.agentic.selftest:main"
dsbench-pi-run = "dsbench.agentic.pi_runner:main"
# Targeted SFT-data generators (ADR-004): the sandbox also MANUFACTURES the fine-tune data.
dsbench-sftgen-a = "dsbench.sftgen.dialect_conventions:main"
dsbench-sftgen-b = "dsbench.sftgen.denominator_reasoning:main"
dsbench-sftgen-c = "dsbench.sftgen.ml_delivery_trajectories:main"
dsbench-sftgen-render = "dsbench.sftgen.render:main"
dsbench-sftgen-decontaminate = "dsbench.sftgen.decontaminate:main"
dsbench-sftgen-breadth = "dsbench.sftgen.breadth.acquire:main"
dsbench-sftgen-assemble = "dsbench.sftgen.assemble:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsbench"]
